name: leaksniff
description: Fail the build when ML scripts or notebooks leak test data into training.
branding:
  icon: droplet
  color: blue
inputs:
  paths:
    description: Files or folders to check
    default: "."
  args:
    description: Extra arguments, e.g. --ignore LS009 --fail-on error
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - shell: bash
      run: leaksniff ${{ inputs.paths }} ${{ inputs.args }}
