name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
      - name: The checker finds the leaky fixtures and nothing else
        run: |
          set +e
          leaksniff tests/fixtures; code=$?
          test $code -eq 1
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The GitHub Action passes on clean code
        uses: ./
        with:
          paths: tests/fixtures/good_churn_opus.py tests/fixtures/good_genes_opus.py
